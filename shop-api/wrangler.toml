name = "sp-shop-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
SITE_URL = "https://spreclamebureau.be"
WORKER_URL = "https://sp-shop-api.spreclamebureau.workers.dev"
ALLOWED_ORIGINS = "https://spreclamebureau.be,https://www.spreclamebureau.be,https://raw.githack.com"   # raw.githack = voorbeeldweergave van de branch
PROBO_ORDER_TYPE = "test"        # pas op "production" zetten na een geslaagde testbestelling
PAYMENT_MODE = "test"            # "test" (niets betalen, testorders), "transfer" (overschrijving) of "mollie"
BANK_IBAN = ""                   # jouw rekeningnummer voor overschrijvingen
BANK_BIC = ""
BANK_NAME = "SP Reclamebureau"
PROBO_CONTACT_EMAIL = "info@sp-agency.be"
MARGIN_PERCENT = "40"            # jouw marge bovenop de Probo-inkoopprijs
MIN_MARGIN_EUR = "7.5"           # minimale marge per product
SHIPPING_EUR = "12.04"           # verzendkost voor de klant (zelfde bedrag als vroeger 9,95 + 21%)
VAT_EXEMPT = "1"                # CS Group: bijzondere vrijstellingsregeling kleine ondernemingen (geen btw aanrekenen)
OWNER_EMAIL = "info@sp-agency.be"
MAIL_FROM = "SP Reclamebureau <shop@spreclamebureau.be>"
# Gegevens op facturen. Zolang SELLER_VAT leeg is, maakt de webshop bestelbevestigingen i.p.v. facturen.
SELLER_NAME = "SP Reclamebureau"
SELLER_LEGAL = "CS Group CommV"
SELLER_ADDRESS = "Rooien 75, 9280 Wieze"
SELLER_VAT = "BE 1045.487.873"
SELLER_IBAN = ""
SELLER_EMAIL = "info@sp-agency.be"

# Geheimen (NIET hier invullen), via:  npx wrangler secret put <NAAM>
#   PROBO_TOKEN      bearer-code van Probo
#   MOLLIE_API_KEY   test_... of live_...
#   SIGNING_SECRET   willekeurige lange tekst
#   ADMIN_KEY        wachtwoord voor /api/admin/...
#   RESEND_API_KEY   (optioneel) voor bevestigingsmails

[[kv_namespaces]]
binding = "ORDERS"
id = "84a0b1afedcf4f9b86a7f0ccdd2a2b1c"

# Zonder R2 worden drukbestanden (max. 25 MB) tijdelijk in KV bewaard.
# Na het activeren van R2 (vraagt een betaalkaart) deze 3 regels aanzetten voor bestanden tot 100 MB:
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "sp-shop-files"    # npx wrangler r2 bucket create sp-shop-files

# Productfoto's verkleinen (Cloudflare Images, gratis tot 5000 bewerkingen/maand)
[images]
binding = "IMAGES"

# Elk uur ontbrekende productfoto's aanvullen
[triggers]
crons = ["17 * * * *"]
